
name: Publish Business Academy A1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare website
        run: |
          mkdir -p _site extracted
          ZIP=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP file not found"
            exit 1
          fi
          unzip -q "$ZIP" -d extracted
          INDEX=$(find extracted -type f -name index.html | head -n 1)
          if [ -z "$INDEX" ]; then
            echo "index.html not found"
            exit 1
          fi
          ROOT=$(dirname "$INDEX")
          cp -a "$ROOT"/. _site/
          test -f _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
