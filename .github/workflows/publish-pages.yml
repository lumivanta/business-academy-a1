
name: Publish Business Academy A1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website
        run: |
          mkdir -p _site

          if [ -f index.html ]; then
            find . -maxdepth 1 -mindepth 1 \
              ! -name '_site' \
              ! -name '.git' \
              ! -name '.github' \
              -exec cp -a {} _site/ \;
          else
            ZIP=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "Website files not found"
              exit 1
            fi

            mkdir extracted
            unzip -q "$ZIP" -d extracted
            INDEX=$(find extracted -type f -name index.html | head -n 1)

            if [ -z "$INDEX" ]; then
              echo "index.html not found in ZIP"
              exit 1
            fi

            ROOT=$(dirname "$INDEX")
            cp -a "$ROOT"/. _site/
          fi

          test -f _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
