
name: Publish Business Academy A1

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Prepare website
        run: |
          mkdir -p _site extracted
          unzip -q business-academy-a1-github-pages.zip -d extracted

          if [ -d "extracted/business-academy-a1" ]; then
            cp -a extracted/business-academy-a1/. _site/
          else
            echo "Website folder not found"
            exit 1
          fi

          test -f _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
